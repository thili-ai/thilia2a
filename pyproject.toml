[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thilia2a"
version = "0.1.0"
description = "A small, hackable Returns Eligibility Assistant: two A2A agents, each missing what the other knows, that delegate to answer one real question — the reference implementation for the Learn Fast course 'Build an A2A Agent'."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "thili.ai" }]
keywords = ["a2a", "agent2agent", "agents", "multi-agent", "protocols"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "a2a-sdk",
  "fastapi",
  "uvicorn",
  "httpx",
  "thilimcp @ git+https://github.com/thili-ai/thilimcp.git",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.hatch.metadata]
# thilimcp is a direct git reference, not a PyPI release — allow it.
allow-direct-references = true

[project.urls]
Homepage = "https://github.com/thili-ai/thilia2a"
Repository = "https://github.com/thili-ai/thilia2a"
"Learn Fast course" = "https://learnfast.thili.ai"

[tool.hatch.build.targets.wheel]
packages = ["thilia2a"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
